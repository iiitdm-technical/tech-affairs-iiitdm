name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate static data
        run: npm run validate:data

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Verify export
        run: test -f out/index.html

  deploy:
    name: Deploy
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 25m
          script: |
            source ~/.bashrc
            set -e

            cd "$HOME/tech-affairs-iiitdm"
            git checkout main
            git pull --ff-only origin main
            test "$(git rev-parse HEAD)" = "${{ github.sha }}" || {
              echo "Refusing to deploy a commit that did not pass this workflow's checks." >&2
              exit 1
            }

            npm ci --include=dev
            npm install --global serve@14.2.6
            ./prepare

            export SERVE_BIN="$(command -v serve)"
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
